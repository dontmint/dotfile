# Nothing logind handles may put this machine to sleep. Closing the lid still
# locks and blanks the panel through Hyprland's lid-switch bindings, and idle
# still turns the display off, but the session keeps running underneath.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
HandleSuspendKey=ignore
HandleSuspendKeyLongPress=ignore
HandleHibernateKey=ignore
HandleHibernateKeyLongPress=ignore
HandlePowerKey=ignore
IdleAction=ignore
