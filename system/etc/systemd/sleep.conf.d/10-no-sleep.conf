# This machine never suspends or hibernates: only the display is allowed to
# power down. With these set, systemctl suspend/hibernate refuse to act and
# logind reports CanSuspend/CanHibernate/CanHybridSleep/CanSuspendThenHibernate
# as "no" -- there is no swap image written and no state lost.
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
